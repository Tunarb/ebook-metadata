[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-metadata"
version = "0.1.0"
description = "Conservative ebook metadata discovery and reconciliation pipeline"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<13",
]

[project.scripts]
ebook-scan = "ebook_metadata.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]
